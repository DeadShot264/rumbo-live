<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1220">
<title>Rumbo · En directo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#0B1220; --card:rgba(16,24,40,.86); --ink:#F4F7FB; --soft:#9FB0C8; --green:#1FD17A; --red:#FF6B6B; --line:rgba(255,255,255,.08); }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  #map { position:fixed; inset:0; }
  .leaflet-tile-pane { filter: saturate(.6) brightness(.82) contrast(1.05); }
  .card { position:fixed; left:12px; right:12px; top:calc(12px + env(safe-area-inset-top)); background:var(--card); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
          border:1px solid var(--line); border-radius:22px; padding:14px 16px; box-shadow:0 18px 40px rgba(0,0,0,.45); z-index:500; max-width:560px; margin:0 auto; }
  .row { display:flex; align-items:center; gap:12px; }
  .avatar { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-weight:800; font-size:18px; color:#fff; flex:none;
            background:linear-gradient(135deg,var(--c,#1FD17A),#0B1220); box-shadow:inset 0 1px 0 rgba(255,255,255,.25); }
  .who { flex:1; min-width:0; }
  .name { font-weight:700; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { color:var(--soft); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill { font-size:11px; font-weight:800; letter-spacing:.08em; padding:5px 9px; border-radius:999px; background:rgba(31,209,122,.15); color:var(--green); display:flex; align-items:center; gap:6px; flex:none; }
  .pill.off { background:rgba(255,255,255,.08); color:var(--soft); }
  .dot { width:8px; height:8px; border-radius:50%; background:currentColor; position:relative; }
  .pill:not(.off) .dot::after { content:""; position:absolute; inset:-5px; border-radius:50%; border:2px solid currentColor; animation:ping 1.3s ease-out infinite; }
  @keyframes ping { from { transform:scale(.4); opacity:.9 } to { transform:scale(1.6); opacity:0 } }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .stat { background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:14px; padding:9px 10px; }
  .stat b { display:block; font-size:20px; font-weight:800; letter-spacing:-.01em; }
  .stat span { color:var(--soft); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
  .bar { position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; gap:10px; z-index:500; max-width:560px; margin:0 auto; }
  .btn { flex:1; text-align:center; padding:14px; border-radius:16px; font-weight:700; text-decoration:none; color:#fff; background:var(--card); border:1px solid var(--line); backdrop-filter:blur(14px); }
  .btn.primary { background:linear-gradient(135deg,#1FD17A,#0E9F6E); border:none; color:#04210F; }
  .btn[aria-disabled=true] { opacity:.45; pointer-events:none; }
  .center { position:fixed; inset:0; display:grid; place-items:center; z-index:600; background:var(--bg); padding:24px; text-align:center; }
  .center h1 { font-size:22px; margin:12px 0 6px; } .center p { color:var(--soft); margin:0; max-width:340px; }
  .me { width:22px; height:22px; border-radius:50%; background:var(--c,#1FD17A); border:3px solid #fff; box-shadow:0 0 0 6px rgba(31,209,122,.25),0 6px 16px rgba(0,0,0,.5); position:relative; }
  .me .hd { position:absolute; left:50%; top:-15px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:10px solid #fff; transform-origin:50% 26px; margin-left:-6px; }
  .openapp { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:650; background:#fff; color:#0B1220;
             font-weight:800; text-decoration:none; padding:11px 18px; border-radius:999px; box-shadow:0 10px 30px rgba(0,0,0,.45); font-size:14px; white-space:nowrap; }
    .brand { position:fixed; right:14px; bottom:calc(132px + env(safe-area-inset-bottom)); z-index:500; font-size:11px; color:var(--soft); background:var(--card); padding:4px 8px; border-radius:8px; }
  .leaflet-control-attribution { background:rgba(11,18,32,.7)!important; color:var(--soft)!important; } .leaflet-control-attribution a { color:#cfe!important; }
</style>
</head>
<body>
<div id="map"></div>
<div class="card" id="card" hidden>
  <div class="row">
    <div class="avatar" id="av">R</div>
    <div class="who"><div class="name" id="name">Viaje en directo</div><div class="sub" id="sub">Conectando…</div></div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pillt">EN DIRECTO</span></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="sp">—</b><span>km/h</span></div>
    <div class="stat"><b id="eta">—</b><span id="etal">llegada</span></div>
    <div class="stat"><b id="ago">—</b><span>actualizado</span></div>
  </div>
</div>
<a class="openapp" id="openapp" hidden>Abrir en la app Rumbo</a>
<div class="brand">Rumbo · cifrado de extremo a extremo</div>
<div class="bar"><a class="btn" id="open" aria-disabled="true" target="_blank" rel="noopener">Abrir en Maps</a><a class="btn primary" id="go" aria-disabled="true" target="_blank" rel="noopener">Cómo llegar</a></div>
<div class="center" id="state"><div><div style="font-size:42px">📡</div><h1>Conectando…</h1><p>Buscando la posición más reciente.</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>if (!window.L) document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');</script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const show = (emoji, title, text) => { $('state').hidden = false; $('state').innerHTML = `<div><div style="font-size:42px">${emoji}</div><h1></h1><p></p></div>`; $('state').querySelector('h1').textContent = title; $('state').querySelector('p').textContent = text; };
  const params = new URLSearchParams(location.hash.slice(1));
  const topic = params.get('t'), keyB64 = params.get('k');
  if (!topic || !keyB64 || !/^[A-Za-z0-9_]{6,64}$/.test(topic)) { show('🔗', 'Enlace no válido', 'Pide que te vuelvan a enviar el enlace desde Rumbo.'); return; }
  const unb64 = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  // En Android, si tienes Rumbo, el viaje se puede seguir desde la app (con avisos al llegar)
  if (/Android/i.test(navigator.userAgent)) {
    const a = $('openapp');
    a.href = `intent://live?t=${topic}&k=${keyB64}#Intent;scheme=rumbo;package=es.kmapp;S.browser_fallback_url=${encodeURIComponent(location.href)};end`;
    a.hidden = false;
  }
  let key;
  try { key = await crypto.subtle.importKey('raw', unb64(keyB64), 'AES-GCM', false, ['decrypt']); }
  catch { show('🔒', 'No se puede abrir', 'Tu navegador no admite el cifrado necesario. Prueba con Chrome o Safari actualizados.'); return; }
  const decrypt = async body => { const b = unb64(body.trim()); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, key, b.slice(12)); return JSON.parse(new TextDecoder().decode(pt)); };

  let map = null, trail = null, glow = null;
  try {
    map = L.map('map', { zoomControl: false, attributionControl: true }).setView([40.42, -3.7], 6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    trail = L.polyline([], { color: '#1FD17A', weight: 5, opacity: .85, lineCap: 'round' }).addTo(map);
    glow = L.polyline([], { color: '#1FD17A', weight: 14, opacity: .18 }).addTo(map);
    map.on('dragstart', () => follow = false);
    map.on('dblclick', () => follow = true);
  } catch (e) { console.warn('Mapa no disponible', e); map = null; }
  let marker = null, acc = null, last = null, follow = true, ended = null, first = true;
  const seen = new Set();

  const fmtAgo = t => { const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? `${Math.round(s)} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.round(s / 3600)} h`; };
  const hhmm = t => new Date(t).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

  function render() {
    if (!last) return;
    $('state').hidden = true; $('card').hidden = false;
    const m = last;
    const name = m.n || m.c || 'Viaje en directo';
    $('name').textContent = name; $('av').textContent = (name.trim()[0] || 'R').toUpperCase();
    if (m.col) document.documentElement.style.setProperty('--c', m.col);
    $('sp').textContent = m.sp != null ? Math.round(m.sp) : '—';
    if (m.eta != null && !ended) { $('eta').textContent = m.eta < 1 ? 'ya' : (m.eta < 60 ? `${Math.round(m.eta)} min` : `${Math.floor(m.eta / 60)} h ${Math.round(m.eta % 60)}`); $('etal').textContent = m.km != null ? `quedan ${m.km.toFixed(m.km < 10 ? 1 : 0)} km` : 'llegada'; }
    else { $('eta').textContent = '—'; $('etal').textContent = 'llegada'; }
    $('ago').textContent = fmtAgo(m.t);
    const stale = Date.now() - m.t > 3 * 60 * 1000;
    const pill = $('pill');
    if (ended) { pill.className = 'pill off'; $('pillt').textContent = ended === 'arrived' ? 'HA LLEGADO' : 'FINALIZADO'; }
    else if (stale) { pill.className = 'pill off'; $('pillt').textContent = 'SIN SEÑAL'; }
    else { pill.className = 'pill'; $('pillt').textContent = m.sp > 3 ? 'EN MARCHA' : 'PARADO'; }
    const parts = [];
    if (ended === 'arrived') parts.push(`Ha llegado a las ${hhmm(m.t)}`);
    else if (ended) parts.push('Ha dejado de compartir su ubicación');
    else { if (m.d) parts.push(`Hacia ${m.d}`); if (m.c && m.n) parts.push(m.c); parts.push(m.a ? 'hasta que llegue' : `hasta las ${hhmm(m.u)}`); }
    $('sub').textContent = parts.join(' · ');
    const ll = `${m.la.toFixed(6)},${m.lo.toFixed(6)}`;
    $('open').href = `https://www.google.com/maps/search/?api=1&query=${ll}`; $('go').href = `https://www.google.com/maps/dir/?api=1&destination=${ll}`;
    $('open').setAttribute('aria-disabled', 'false'); $('go').setAttribute('aria-disabled', 'false');
  }

  async function onMessage(id, body) {
    if (seen.has(id)) return; seen.add(id);
    let m; try { m = await decrypt(body); } catch { return; }
    if (m.end) { ended = m.end; render(); return; }
    if (typeof m.la !== 'number') return;
    if (last && m.t < last.t) return;
    ended = null; last = m;
    const p = [m.la, m.lo];
    if (map) try {
    trail.addLatLng(p); glow.addLatLng(p);
    if (!marker) {
      marker = L.marker(p, { icon: L.divIcon({ className: '', html: '<div class="me"><div class="hd" id="hd"></div></div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map);
      acc = L.circle(p, { radius: m.ac || 20, color: '#1FD17A', weight: 1, fillOpacity: .08 }).addTo(map);
    } else { marker.setLatLng(p); acc.setLatLng(p).setRadius(m.ac || 20); }
    const hd = document.getElementById('hd');
    if (hd) { hd.style.display = m.hd != null && m.sp > 3 ? 'block' : 'none'; hd.style.transform = `rotate(${m.hd || 0}deg)`; }
    if (first) { map.setView(p, 15); first = false; } else if (follow) map.panTo(p, { animate: true });
    } catch (e) { console.warn(e); }
    render();
  }

  // Historial reciente y luego en directo (los mensajes llegan cifrados; ntfy.sh nunca ve la clave)
  const handle = j => { if (j && j.event === 'message' && j.message) onMessage(j.id || j.message.slice(0, 24), j.message); };
  // En directo por SSE…
  try {
    const es = new EventSource(`https://ntfy.sh/${topic}/sse?since=12h`);
    es.onmessage = e => { try { handle(JSON.parse(e.data)); } catch {} };
    es.onerror = () => { if (!last) show('📡', 'Esperando señal…', 'Aún no ha llegado ninguna posición. Se actualizará sola.'); };
  } catch (e) { console.warn(e); }
  // …y una consulta cada 15 s por si la conexión en directo falla (redes que cortan SSE)
  async function poll() {
    try {
      const r = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=12h`, { cache: 'no-store' });
      const txt = await r.text();
      for (const line of txt.split('\n')) { if (line.trim()) { try { handle(JSON.parse(line)); } catch {} } }
    } catch (e) { console.warn(e); }
  }
  poll(); setInterval(poll, 15000);
  setTimeout(() => { if (!last) show('⏳', 'Esperando la primera posición', 'Si el enlace es antiguo puede haber caducado. La página se actualiza sola.'); }, 12000);
  setInterval(render, 5000);
})();
</script>
</body>
</html>
