<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1220">
<title>Rumbo · En directo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
  :root { --bg:#0B1220; --card:rgba(16,24,40,.9); --ink:#F4F7FB; --soft:#9FB0C8; --green:#1FD17A; --line:rgba(255,255,255,.08); }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  #map { position:fixed; inset:0; }
  .card { position:fixed; left:12px; right:12px; top:calc(12px + env(safe-area-inset-top)); background:var(--card); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
          border:1px solid var(--line); border-radius:22px; padding:14px 16px; box-shadow:0 18px 40px rgba(0,0,0,.45); z-index:5; max-width:560px; margin:0 auto; transition:opacity .25s, transform .25s; }
  .row { display:flex; align-items:center; gap:12px; }
  .avatar { width:52px; height:52px; border-radius:14px; display:grid; place-items:center; flex:none; background:rgba(255,255,255,.06); overflow:hidden; }
  .avatar.photo { width:84px; background-size:contain; background-repeat:no-repeat; background-position:center; }
  .avatar svg { height:46px; transform:rotate(90deg); }
  .who { flex:1; min-width:0; } .name { font-weight:800; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { color:var(--soft); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill { font-size:11px; font-weight:800; letter-spacing:.08em; padding:5px 9px; border-radius:999px; background:rgba(31,209,122,.15); color:var(--green); display:flex; align-items:center; gap:6px; flex:none; }
  .pill.off { background:rgba(255,255,255,.08); color:var(--soft); }
  .dot { width:8px; height:8px; border-radius:50%; background:currentColor; position:relative; }
  .pill:not(.off) .dot::after { content:""; position:absolute; inset:-5px; border-radius:50%; border:2px solid currentColor; animation:ping 1.3s ease-out infinite; }
  @keyframes ping { from { transform:scale(.4); opacity:.9 } to { transform:scale(1.6); opacity:0 } }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .stat { background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:14px; padding:9px 10px; }
  .stat b { display:block; font-size:20px; font-weight:800; } .stat span { color:var(--soft); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
  .mini { position:fixed; left:50%; transform:translateX(-50%); top:calc(12px + env(safe-area-inset-top)); z-index:5; background:var(--card); backdrop-filter:blur(14px);
          border:1px solid var(--line); border-radius:999px; padding:8px 14px; display:flex; align-items:center; gap:8px; font-size:14px; white-space:nowrap; max-width:calc(100% - 24px); cursor:pointer; }
  .mini .dot { color:var(--green); } .mini b { overflow:hidden; text-overflow:ellipsis; }
  .bar { position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; gap:10px; z-index:5; max-width:560px; margin:0 auto; }
  .btn { flex:1; text-align:center; padding:14px; border-radius:16px; font-weight:700; text-decoration:none; color:#fff; background:var(--card); border:1px solid var(--line); backdrop-filter:blur(14px); }
  .btn.primary { background:linear-gradient(135deg,#1FD17A,#0E9F6E); border:none; color:#04210F; }
  .btn[aria-disabled=true] { opacity:.45; pointer-events:none; }
  .tools { position:fixed; right:12px; top:50%; transform:translateY(-50%); z-index:6; display:flex; flex-direction:column; gap:10px; }
  .tool { width:46px; height:46px; border-radius:50%; border:none; background:#fff; color:#0B1220; font:800 15px system-ui; box-shadow:0 8px 24px rgba(0,0,0,.35); cursor:pointer; }
  .center { position:fixed; inset:0; display:grid; place-items:center; z-index:20; background:var(--bg); padding:24px; text-align:center; }
  .center h1 { font-size:22px; margin:12px 0 6px; } .center p { color:var(--soft); margin:0; max-width:340px; }
  .car { filter: drop-shadow(0 6px 5px rgba(0,0,0,.45)); }
  .carimg { width:64px; height:40px; background-size:contain; background-repeat:no-repeat; background-position:center; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
  .dest { width:20px; height:20px; border-radius:50%; background:#FF4D6D; border:3px solid #fff; box-shadow:0 4px 12px rgba(0,0,0,.4); }
  .openapp { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:8; background:#fff; color:#0B1220;
             font-weight:800; text-decoration:none; padding:11px 18px; border-radius:999px; box-shadow:0 10px 30px rgba(0,0,0,.45); font-size:14px; white-space:nowrap; }
  body.compact .card, body.compact .bar, body.compact .openapp { display:none !important; }
  body:not(.compact) .mini { display:none; }
  .maplibregl-ctrl-attrib { font-size:10px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="card" id="card" hidden>
  <div class="row">
    <div class="avatar" id="av"></div>
    <div class="who"><div class="name" id="name">Viaje en directo</div><div class="sub" id="sub">Conectando…</div></div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pillt">EN DIRECTO</span></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="sp">—</b><span>km/h</span></div>
    <div class="stat"><b id="eta">—</b><span id="etal">llegada</span></div>
    <div class="stat"><b id="ago">—</b><span>actualizado</span></div>
  </div>
</div>
<div class="mini" id="mini" title="Mostrar detalles"><span class="dot"></span><b id="miniName">Rumbo</b><span id="miniInfo"></span></div>
<div class="tools" id="tools" hidden>
  <button class="tool" id="bView" title="Cambiar vista">🎯</button>
  <button class="tool" id="bSat" title="Satélite">🌍</button>
  <button class="tool" id="bFollow" title="Volver a su coche" hidden>📍</button>
  <button class="tool" id="bCompact" title="Solo el mapa">⤡</button>
</div>
<a class="openapp" id="openapp" hidden>Abrir en la app Rumbo</a>
<div class="bar"><a class="btn" id="open" aria-disabled="true" target="_blank" rel="noopener">Abrir en Maps</a><a class="btn primary" id="go" aria-disabled="true" target="_blank" rel="noopener">Cómo llegar</a></div>
<div class="center" id="state"><div><div style="font-size:42px">📡</div><h1>Conectando…</h1><p>Buscando la posición más reciente.</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script>if (!window.maplibregl) { document.write('<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"><\/script>'); }</script>
<script>
const FIGS = {"berlina": [["b", "M10 5 C14 2 26 2 30 5 C33 7 34 12 34 18 L34 66 C34 73 30 77 20 77 C10 77 6 73 6 66 L6 18 C6 12 7 7 10 5 Z"], ["m", "M3.5 25 L6 24 L6 29 L3.5 28.5 Z M36.5 25 L34 24 L34 29 L36.5 28.5 Z"], ["g", "M9.5 24 C14 21 26 21 30.5 24 L28.5 33 L11.5 33 Z"], ["r", "M11.5 33 L28.5 33 L28 50 L12 50 Z"], ["g", "M12 50 L28 50 L29.5 57 C24 59 16 59 10.5 57 Z"], ["g", "M9 34 L11 34 L11.5 49 L9.5 52 Z M31 34 L29 34 L28.5 49 L30.5 52 Z"], ["l", "M9 6.5 L14 5 L14 8 L8.5 9.5 Z M31 6.5 L26 5 L26 8 L31.5 9.5 Z"], ["t", "M8 72 L13 74.5 L12 76 L7.5 74 Z M32 72 L27 74.5 L28 76 L32.5 74 Z"]], "compacto": [["b", "M10 10 C14 7 26 7 30 10 C33 12 34 16 34 22 L34 64 C34 70 31 73 20 73 C9 73 6 70 6 64 L6 22 C6 16 7 12 10 10 Z"], ["m", "M3.5 28 L6 27 L6 32 L3.5 31.5 Z M36.5 28 L34 27 L34 32 L36.5 31.5 Z"], ["g", "M9.5 27 C14 24 26 24 30.5 27 L28.5 35 L11.5 35 Z"], ["r", "M11.5 35 L28.5 35 L28.5 60 L11.5 60 Z"], ["g", "M11.5 60 L28.5 60 L29.5 66 C24 68 16 68 10.5 66 Z"], ["g", "M9 36 L11 36 L11 58 L9.5 60 Z M31 36 L29 36 L29 58 L30.5 60 Z"], ["l", "M9 11 L14 9.5 L14 12.5 L8.5 14 Z M31 11 L26 9.5 L26 12.5 L31.5 14 Z"], ["t", "M7.5 68 L12 70.5 L11 72 L7 70 Z M32.5 68 L28 70.5 L29 72 L33 70 Z"]], "suv": [["b", "M8 6 C12 3 28 3 32 6 C35 8 36 12 36 18 L36 68 C36 74 33 77 20 77 C7 77 4 74 4 68 L4 18 C4 12 5 8 8 6 Z"], ["m", "M1.5 24 L4 23 L4 29 L1.5 28.5 Z M38.5 24 L36 23 L36 29 L38.5 28.5 Z"], ["g", "M8 23 C13 20 27 20 32 23 L30.5 31 L9.5 31 Z"], ["r", "M9.5 31 L30.5 31 L30.5 64 L9.5 64 Z"], ["k", "M11 33 L12 33 L12 62 L11 62 Z M28 33 L29 33 L29 62 L28 62 Z"], ["g", "M9.5 64 L30.5 64 L31 70 C25 72 15 72 9 70 Z"], ["g", "M7 32 L9 32 L9 63 L7 64 Z M33 32 L31 32 L31 63 L33 64 Z"], ["l", "M7 7.5 L13 5.5 L13 9 L6.5 10.5 Z M33 7.5 L27 5.5 L27 9 L33.5 10.5 Z"], ["t", "M5.5 72 L11 75 L10 76.5 L5 74.5 Z M34.5 72 L29 75 L30 76.5 L35 74.5 Z"]], "deportivo": [["b", "M12 4 C16 1 24 1 28 4 C33 8 35 16 35 26 L35 64 C35 72 31 77 20 77 C9 77 5 72 5 64 L5 26 C5 16 7 8 12 4 Z"], ["m", "M2.5 33 L5 32 L5 37 L2.5 36.5 Z M37.5 33 L35 32 L35 37 L37.5 36.5 Z"], ["k", "M18.5 3 L21.5 3 L21.5 30 L18.5 30 Z"], ["g", "M9 32 C14 29 26 29 31 32 L29 40 L11 40 Z"], ["r", "M11 40 L29 40 L28.5 52 L11.5 52 Z"], ["g", "M11.5 52 L28.5 52 L30 60 C24 62 16 62 10 60 Z"], ["g", "M8.5 41 L10.5 41 L11 51 L9 54 Z M31.5 41 L29.5 41 L29 51 L31 54 Z"], ["l", "M10 6 L15 3.5 L15 7 L9 9 Z M30 6 L25 3.5 L25 7 L31 9 Z"], ["t", "M6.5 71 L14 75 L13 76.5 L6 73.5 Z M33.5 71 L26 75 L27 76.5 L34 73.5 Z"]], "furgoneta": [["b", "M8 4 C12 2 28 2 32 4 C35 5 36 8 36 12 L36 74 C36 76 35 77 33 77 L7 77 C5 77 4 76 4 74 L4 12 C4 8 5 5 8 4 Z"], ["m", "M1.5 14 L4 13 L4 19 L1.5 18.5 Z M38.5 14 L36 13 L36 19 L38.5 18.5 Z"], ["g", "M7.5 13 C13 11 27 11 32.5 13 L31 20 L9 20 Z"], ["r", "M9 20 L31 20 L31 75 L9 75 Z"], ["k", "M9 32 L31 32 L31 33 L9 33 Z M9 46 L31 46 L31 47 L9 47 Z M9 60 L31 60 L31 61 L9 61 Z"], ["g", "M6.5 21 L8.5 21 L8.5 30 L6.5 30 Z M33.5 21 L31.5 21 L31.5 30 L33.5 30 Z"], ["l", "M6.5 5 L12 3.5 L12 6.5 L6 8 Z M33.5 5 L28 3.5 L28 6.5 L34 8 Z"], ["t", "M4.5 73 L8 73 L8 76.5 L5 76.5 Z M35.5 73 L32 73 L32 76.5 L35 76.5 Z"]]};
function shade(hex, f) {
  const n = parseInt((hex || '#1FD17A').slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const lum = (0.3 * r + 0.59 * g + 0.11 * b) / 255; const k = lum < 0.18 ? 1 + (1 - f) * 2.2 : f;
  const c = v => Math.max(0, Math.min(255, Math.round(v * k))).toString(16).padStart(2, '0');
  return '#' + c(r) + c(g) + c(b);
}
// Figura del coche vista desde arriba; con «depth» se le da volumen (vista 3D)
function figSvg(fig, col, h, depth) {
  const parts = FIGS[fig] || FIGS.berlina; const w = h / 2;
  const fill = { b: col, m: col, r: shade(col, .82), g: '#1B2330', l: '#FFF6D6', t: '#FF3B3B', k: 'rgba(0,0,0,.3)' };
  const body = parts.find(p => p[0] === 'b')[1];
  const side = depth ? [4, 3, 2, 1].map(k => `<path d="${body}" fill="${shade(col, .55)}" transform="translate(0 ${k * 0.9})"/>`).join('') : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 40 86" width="${w}" height="${h}">` + side +
    parts.map(([r, d]) => `<path d="${d}" fill="${fill[r]}"${r === 'b' ? ' stroke="#fff" stroke-width="1.6"' : ''}/>`).join('') + '</svg>';
}
(async () => {
  const $ = id => document.getElementById(id);
  const show = (emoji, title, text) => { $('state').hidden = false; $('state').innerHTML = `<div><div style="font-size:42px">${emoji}</div><h1></h1><p></p></div>`; $('state').querySelector('h1').textContent = title; $('state').querySelector('p').textContent = text; };
  const params = new URLSearchParams(location.hash.slice(1));
  const topic = params.get('t'), keyB64 = params.get('k');
  if (!topic || !keyB64 || !/^[A-Za-z0-9_]{6,64}$/.test(topic)) { show('🔗', 'Enlace no válido', 'Pide que te vuelvan a enviar el enlace desde Rumbo.'); return; }
  const unb64 = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  if (/Android/i.test(navigator.userAgent)) {
    const a = $('openapp');
    a.href = `intent://live?t=${topic}&k=${keyB64}#Intent;scheme=rumbo;package=es.kmapp;S.browser_fallback_url=${encodeURIComponent(location.href)};end`;
    a.hidden = false;
  }
  let key;
  try { key = await crypto.subtle.importKey('raw', unb64(keyB64), 'AES-GCM', false, ['decrypt', 'encrypt']); }
  catch { show('🔒', 'No se puede abrir', 'Tu navegador no admite el cifrado necesario. Prueba con Chrome o Safari actualizados.'); return; }
  const decrypt = async body => { const b = unb64(body.trim()); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, key, b.slice(12)); return JSON.parse(new TextDecoder().decode(pt)); };

  // Preferencias de vista de quien mira
  const pref = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
  const setPref = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  let view = +pref('rv_view', 1);          // 0 general · 1 seguir · 2 conducción 3D
  let sat = pref('rv_sat', '0') === '1';
  if (pref('rv_compact', '0') === '1') document.body.classList.add('compact');

  let map = null, ready = false, follow = true;
  try {
    map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', center: [-3.7, 40.42], zoom: 5, pitch: 0, attributionControl: { compact: true } });
    map.on('load', () => {
      map.addSource('sat', { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256, attribution: 'Imágenes © Esri' });
      map.addLayer({ id: 'sat', type: 'raster', source: 'sat', layout: { visibility: sat ? 'visible' : 'none' } }, map.getStyle().layers.find(l => l.type === 'symbol')?.id);
      map.addSource('trail', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
      map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
      map.addLayer({ id: 'trail', type: 'line', source: 'trail', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#7C8CA5', 'line-width': 5, 'line-opacity': .75 } });
      map.addLayer({ id: 'routeCase', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#fff', 'line-width': 11 } });
      map.addLayer({ id: 'route', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#1FD17A', 'line-width': 6.5 } });
      // Edificios en 3D (si el estilo no los trae ya)
      if (!map.getLayer('building-3d') && map.getSource('openmaptiles')) {
        map.addLayer({ id: 'b3d', type: 'fill-extrusion', source: 'openmaptiles', 'source-layer': 'building', minzoom: 14,
          paint: { 'fill-extrusion-color': '#d6d9de', 'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 8], 'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0], 'fill-extrusion-opacity': .85 } });
      }
      ready = true; if (last) { drawTrail(); drawRoute(last, true); camera(false); }
    });
    map.on('dragstart', () => { follow = false; $('bFollow').hidden = false; });
    map.on('rotatestart', e => { if (e.originalEvent) { follow = false; $('bFollow').hidden = false; } });
  } catch (e) { console.warn('Mapa no disponible', e); map = null; }

  const viewIcon = () => ['🗺', '🎯', '3D'][view];
  $('bView').textContent = viewIcon(); $('bSat').textContent = sat ? '🛰' : '🌍';
  $('bView').onclick = () => { view = (view + 1) % 3; setPref('rv_view', view); $('bView').textContent = viewIcon(); follow = true; $('bFollow').hidden = true; refreshCar(); camera(true); };
  $('bSat').onclick = () => { sat = !sat; setPref('rv_sat', sat ? '1' : '0'); $('bSat').textContent = sat ? '🛰' : '🌍'; if (ready) map.setLayoutProperty('sat', 'visibility', sat ? 'visible' : 'none'); };
  $('bFollow').onclick = () => { follow = true; $('bFollow').hidden = true; camera(true); };
  const toggleCompact = () => { const c = document.body.classList.toggle('compact'); setPref('rv_compact', c ? '1' : '0'); $('bCompact').textContent = c ? '⤢' : '⤡'; };
  $('bCompact').onclick = toggleCompact; $('mini').onclick = toggleCompact;
  $('bCompact').textContent = document.body.classList.contains('compact') ? '⤢' : '⤡';

  let marker = null, markerEl = null, destMarker = null, last = null, ended = null, session = -1, heading = 0;
  const seen = new Set(); const imgs = {}; let carUrl = '', carShown = '';
  let trail = [], routeAt = 0, routePts = [], fitted = false;

  const figOf = m => (m.fig && m.fig !== 'foto') ? m.fig : (m.fig === 'foto' && carUrl ? 'foto' : 'berlina');
  function refreshCar() {
    if (!markerEl || !last) return;
    const f = figOf(last);
    markerEl.innerHTML = f === 'foto' ? `<div class="carimg" style="background-image:url(${carUrl})"></div>` : `<div class="car">${figSvg(f, last.col || '#1FD17A', view === 2 ? 74 : 60, view === 2)}</div>`;
    if (marker) { marker.setRotation(f === 'foto' ? 0 : heading); marker.setRotationAlignment(f === 'foto' ? 'viewport' : 'map'); marker.setPitchAlignment(f === 'foto' ? 'viewport' : 'map'); }
  }
  function camera(animate) {
    if (!map || !last) return;
    const c = [last.lo, last.la];
    if (view === 0 || ended) {
      const pts = trail.concat(routePts).concat([c]);
      if (pts.length > 1) { const b = pts.reduce((b, p) => b.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
        map.fitBounds(b, { padding: { top: 200, bottom: 140, left: 40, right: 80 }, pitch: 0, bearing: 0, duration: animate ? 1000 : 0, maxZoom: 16 }); }
      else map.easeTo({ center: c, zoom: 15, pitch: 0, bearing: 0, duration: animate ? 1000 : 0 });
    } else if (view === 2) map.easeTo({ center: c, zoom: 17.4, pitch: 62, bearing: heading, duration: animate ? 1200 : 900, padding: { top: 200, bottom: 60 } });
    else map.easeTo({ center: c, zoom: Math.max(14, Math.min(map.getPitch() > 5 ? 16 : map.getZoom() < 6 ? 16 : map.getZoom(), 18)), pitch: 0, bearing: 0, duration: animate ? 1000 : 900, padding: { top: 120, bottom: 80 } });
  }
  function resetSession() { trail = []; routePts = []; fitted = false; routeAt = 0; ended = null; last = null; if (ready) { drawTrail(); map.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }); } if (destMarker) { destMarker.remove(); destMarker = null; } }
  function drawTrail() { if (ready) map.getSource('trail').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: trail } }); }
  async function drawRoute(m, force) {
    if (!map || m.dla == null || ended) return;
    if (!destMarker) { const el = document.createElement('div'); el.className = 'dest'; destMarker = new maplibregl.Marker({ element: el }).setLngLat([m.dlo, m.dla]).addTo(map); }
    else destMarker.setLngLat([m.dlo, m.dla]);
    if (!force && Date.now() - routeAt < 90000) return;
    routeAt = Date.now();
    let pts = [[m.lo, m.la], [m.dlo, m.dla]];
    try {
      const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${m.lo},${m.la};${m.dlo},${m.dla}?overview=full&geometries=geojson`);
      pts = (await r.json()).routes[0].geometry.coordinates;
    } catch (e) { console.warn('Ruta no disponible', e); }
    routePts = pts;
    if (ready) { map.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: pts } }); map.setPaintProperty('route', 'line-color', m.col || '#1FD17A'); }
    if (!fitted && view === 0) { fitted = true; camera(true); }
  }
  // El coche se desliza suavemente entre posiciones
  let anim = null;
  function moveCar(to) {
    if (!marker) return;
    const from = marker.getLngLat(); const t0 = performance.now();
    cancelAnimationFrame(anim);
    const step = now => { const t = Math.min(1, (now - t0) / 1000); marker.setLngLat([from.lng + (to[0] - from.lng) * t, from.lat + (to[1] - from.lat) * t]); if (t < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step);
  }

  const fmtAgo = t => { const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? `${Math.round(s)} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.round(s / 3600)} h`; };
  const hhmm = t => new Date(t).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  function render() {
    if (!last) return;
    $('state').hidden = true; $('card').hidden = false; $('tools').hidden = !map;
    const m = last;
    const title = [m.n, m.c].filter(Boolean).join(' · ') || 'Viaje en directo';
    $('name').textContent = title; $('miniName').textContent = m.n || m.c || 'En directo'; document.title = `${m.n || m.c || 'Rumbo'} · En directo`;
    const f = figOf(m), av = $('av');
    if (f === 'foto') { av.className = 'avatar photo'; av.style.backgroundImage = `url(${carUrl})`; av.innerHTML = ''; }
    else { av.className = 'avatar'; av.style.backgroundImage = ''; av.innerHTML = figSvg(f, m.col || '#1FD17A', 46); }
    $('sp').textContent = m.sp != null ? Math.round(m.sp) : '—';
    let etaTxt = null;
    if (m.eta != null && !ended) { etaTxt = m.eta < 1 ? 'ya' : (m.eta < 60 ? `${Math.round(m.eta)} min` : `${Math.floor(m.eta / 60)} h ${Math.round(m.eta % 60)}`); $('eta').textContent = etaTxt; $('etal').textContent = m.km != null ? `quedan ${m.km.toFixed(m.km < 10 ? 1 : 0)} km` : 'llegada'; }
    else { $('eta').textContent = '—'; $('etal').textContent = 'llegada'; }
    $('ago').textContent = fmtAgo(m.t);
    $('miniInfo').textContent = [m.sp != null ? `${Math.round(m.sp)} km/h` : null, etaTxt ? `llega en ${etaTxt}` : null, ended === 'arrived' ? 'ha llegado' : null].filter(Boolean).map(s => ' · ' + s).join('');
    const stale = Date.now() - m.t > 3 * 60 * 1000;
    const pill = $('pill');
    if (ended) { pill.className = 'pill off'; $('pillt').textContent = ended === 'arrived' ? 'HA LLEGADO' : 'FINALIZADO'; }
    else if (stale) { pill.className = 'pill off'; $('pillt').textContent = 'SIN SEÑAL'; }
    else { pill.className = 'pill'; $('pillt').textContent = m.sp > 3 ? 'EN MARCHA' : 'PARADO'; }
    const parts = [];
    if (ended === 'arrived') parts.push(`Ha llegado a las ${hhmm(m.t)}`);
    else if (ended) parts.push('Ha dejado de compartir su ubicación');
    else { if (m.d) parts.push(`Hacia ${m.d}`); parts.push(m.a ? 'hasta que llegue' : `hasta las ${hhmm(m.u)}`); }
    $('sub').textContent = parts.join(' · ');
    const ll = `${m.la.toFixed(6)},${m.lo.toFixed(6)}`;
    $('open').href = `https://www.google.com/maps/search/?api=1&query=${ll}`; $('go').href = `https://www.google.com/maps/dir/?api=1&destination=${ll}`;
    $('open').setAttribute('aria-disabled', 'false'); $('go').setAttribute('aria-disabled', 'false');
  }

  async function onMessage(id, body) {
    if (seen.has(id)) return; seen.add(id);
    let m; try { m = await decrypt(body); } catch { return; }
    if (m.img) {
      const a = imgs[m.id] || (imgs[m.id] = new Array(m.n).fill(null)); a[m.i] = m.img;
      if (a.every(x => x) && m.id > carShown) {
        carShown = m.id;
        const raw = a.map(x => atob(x)).join(''); const bytes = Uint8Array.from(raw, c => c.charCodeAt(0));
        carUrl = URL.createObjectURL(new Blob([bytes], { type: 'image/webp' }));
        refreshCar(); render();
      }
      return;
    }
    // Cada viaje lleva su sesión: con el enlace fijo, solo se muestra el más reciente
    const st = m.st || 0;
    if (st < session) return;
    if (st > session) { session = st; resetSession(); }
    if (m.end) { ended = m.end; if (ready) map.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }); render(); camera(true); return; }
    if (typeof m.la !== 'number') return;
    if (last && m.t < last.t) return;
    ended = null; const first = !last; last = m;
    if (m.hd != null && m.sp > 3) heading = m.hd;
    const p = [m.lo, m.la];
    trail.push(p); drawTrail();
    if (map) try {
      if (!marker) {
        markerEl = document.createElement('div');
        marker = new maplibregl.Marker({ element: markerEl, rotationAlignment: 'map', pitchAlignment: 'map' }).setLngLat(p).addTo(map);
        refreshCar();
      } else { refreshCar(); moveCar(p); }
      drawRoute(m, first);
      if (follow && (view !== 0 || first)) camera(!first);
    } catch (e) { console.warn(e); }
    render();
  }

  const handle = j => { if (j && j.event === 'message' && j.message) onMessage(j.id || j.message.slice(0, 24), j.message); };
  try {
    const es = new EventSource(`https://ntfy.sh/${topic}/sse?since=12h`);
    es.onmessage = e => { try { handle(JSON.parse(e.data)); } catch {} };
    es.onerror = () => { if (!last) show('📡', 'Esperando señal…', 'Aún no ha llegado ninguna posición. Se actualizará sola.'); };
  } catch (e) { console.warn(e); }
  async function poll() {
    try {
      const r = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=12h`, { cache: 'no-store' });
      const txt = await r.text();
      for (const line of txt.split('\n')) { if (line.trim()) { try { handle(JSON.parse(line)); } catch {} } }
    } catch (e) { console.warn(e); }
  }
  poll(); setInterval(poll, 15000);

  // «Estoy mirando»: señal anónima y cifrada; el identificador sale del propio navegador para no contar dos veces
  const b64u = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  let viewer = null;
  try { viewer = localStorage.getItem('rumbo_viewer'); } catch (e) {}
  if (!viewer) {
    try {
      const fp = new TextEncoder().encode([navigator.userAgent, screen.width, screen.height, Intl.DateTimeFormat().resolvedOptions().timeZone].join('|'));
      viewer = 'w' + b64u(new Uint8Array(await crypto.subtle.digest('SHA-256', fp))).slice(0, 11);
    } catch (e) { viewer = 'w' + Math.random().toString(36).slice(2, 13); }
    try { localStorage.setItem('rumbo_viewer', viewer); } catch (e) {}
  }
  async function beat() {
    if (document.hidden) return;
    try {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify({ v: viewer, t: Date.now() }))));
      const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
      await fetch(`https://ntfy.sh/${topic}_v`, { method: 'POST', body: b64u(all) });
    } catch (e) {}
  }
  beat(); setInterval(beat, 25000); document.addEventListener('visibilitychange', beat);
  setTimeout(() => { if (!last) show('⏳', 'Esperando la primera posición', 'Cuando empiece a compartir aparecerá aquí. La página se actualiza sola.'); }, 12000);
  setInterval(render, 5000);
})();
</script>
</body>
</html>
